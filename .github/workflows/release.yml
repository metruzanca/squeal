name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  extract-release-notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract latest changelog section
        id: notes
        run: |
          # Extract the latest version section (between first '## [' and the next '## [' or EOF)
          body=$(awk '/^## \[/ { if (found) exit; found=1; next } found { print }' CHANGELOG.md)
          # Handle multiline output for GitHub Actions
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  build:
    needs: extract-release-notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../squeal-${{ matrix.target }}.tar.gz squeal
          cd -

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../squeal-${{ matrix.target }}.zip squeal.exe
          cd -

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: squeal-${{ matrix.target }}
          path: |
            squeal-${{ matrix.target }}.*

  create-release:
    needs: [extract-release-notes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.extract-release-notes.outputs.body }}
          files: artifacts/*
          draft: false
          prerelease: false
