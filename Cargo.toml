[package]
name = "squeal"
version = "0.3.0"
authors = ["metruzanca <https://github.com/metruzanca>"]
edition = "2024"
license = "MIT"
description = "A lightweight TUI SQLite database viewer built in Rust."
repository = "https://github.com/metruzanca/squeal"
keywords = ["sqlite", "tui", "database", "viewer", "cli"]
categories = ["command-line-utilities", "database"]
rust-version = "1.85"

[dependencies]
crossterm = "0.29"
ratatui = "0.29"
rusqlite = { version = "0.31", features = ["bundled"] }
postgres = { version = "0.19", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
uuid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tui-syntax = "0.6"
artbox = { version = "0.3", features = ["ratatui"] }
fuzzy-matcher = "0.3"

[dev-dependencies]
testcontainers = { version = "0.27", features = ["blocking"] }
